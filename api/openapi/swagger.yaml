components:
  schemas:
    ConfirmationCodeRequest:
      properties:
        code:
          type: string
      type: object
    ErrorResponse:
      properties:
        error:
          properties:
            code:
              type: string
            details:
              items:
                $ref: '#/components/schemas/FieldError'
              type: array
              uniqueItems: false
            message:
              type: string
          type: object
      type: object
    FieldError:
      properties:
        field:
          type: string
        message:
          type: string
      type: object
    ForgotPasswordRequest:
      properties:
        email:
          type: string
      type: object
    GoogleLoginRequest:
      properties:
        code:
          type: string
      type: object
    LoginRequest:
      properties:
        email:
          type: string
        password:
          type: string
      type: object
    MessageResponse:
      properties:
        data:
          properties:
            message:
              type: string
          type: object
      type: object
    RefreshTokenRequest:
      properties:
        refresh_token:
          type: string
      type: object
    RegisterRequest:
      properties:
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        password:
          type: string
      type: object
    ResetPasswordRequest:
      properties:
        code:
          type: string
        email:
          type: string
        new_password:
          type: string
      type: object
    Session:
      properties:
        expires_at:
          type: string
        refresh_expires_at:
          type: string
        refresh_token:
          type: string
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
      type: object
    SessionResponse:
      properties:
        data:
          $ref: '#/components/schemas/Session'
      type: object
    User:
      properties:
        created_at:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
        first_name:
          type: string
        id:
          type: integer
        image_url:
          type: string
        last_name:
          type: string
        updated_at:
          type: string
      type: object
    UserResponse:
      properties:
        data:
          $ref: '#/components/schemas/User'
      type: object
    VerifyRegistrationRequest:
      properties:
        code:
          type: string
        email:
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      description: '"Bearer <token>": a JWT access token, or an API key where the
        route allows it.'
      in: header
      name: Authorization
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: 'Self-hosted URL shortener. JSON keys are snake_case; every success
    is {"data": ...} and every failure {"error": {...}}.'
  title: useshortly API
  version: "1.0"
openapi: 3.1.0
paths:
  /auth/forgot-password:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
              description: Account email
              summary: body
        description: Account email
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
      summary: Request a password reset code
      tags:
      - auth
  /auth/google:
    post:
      description: Only available when Google sign-in is configured on the server.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
              description: Google authorization code
              summary: body
        description: Google authorization code
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
      summary: Sign in with Google
      tags:
      - auth
  /auth/login:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
              description: Credentials
              summary: body
        description: Credentials
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
      summary: Sign in
      tags:
      - auth
  /auth/logout:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
              description: Refresh token to revoke
              summary: body
        description: Refresh token to revoke
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
      summary: Sign out
      tags:
      - auth
  /auth/refresh:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
              description: Refresh token
              summary: body
        description: Refresh token
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
      summary: Refresh a session
      tags:
      - auth
  /auth/register:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
              description: Account data
              summary: body
        description: Account data
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
      summary: Start a signup
      tags:
      - auth
  /auth/register/verify:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRegistrationRequest'
              description: Email and emailed code
              summary: body
        description: Email and emailed code
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
      summary: Confirm a signup and sign in
      tags:
      - auth
  /auth/reset-password:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
              description: Email, emailed code and new password
              summary: body
        description: Email, emailed code and new password
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
      summary: Reset a password
      tags:
      - auth
  /me:
    delete:
      description: Deletes the user, every organization they own and what is in them.
        It cannot be undone.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationCodeRequest'
              description: Emailed confirmation code
              summary: body
        description: Emailed confirmation code
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
      security:
      - BearerAuth: []
      summary: Delete the account
      tags:
      - me
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
      security:
      - BearerAuth: []
      summary: Get the signed-in user
      tags:
      - me
  /me/delete-code:
    post:
      description: Only available when account deletion is enabled on the server.
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: Accepted
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
      security:
      - BearerAuth: []
      summary: Request an account deletion code
      tags:
      - me
servers:
- url: /api/v1
