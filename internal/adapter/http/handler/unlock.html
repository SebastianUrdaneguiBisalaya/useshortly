<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Protected link</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #5b6470; --line: #d5d9e0; --accent: #2457d6; --error: #b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --card: #1c2027; --text: #eceff3; --muted: #a0a8b4; --line: #333a45; --accent: #6b93ff; --error: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
  main { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; }
  h1 { margin: 0 0 4px; font-size: 1.25rem; }
  p { margin: 0 0 20px; color: var(--muted); }
  label { display: block; margin-bottom: 6px; font-size: .875rem; font-weight: 600; }
  input { width: 100%; padding: 10px 12px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { width: 100%; margin-top: 14px; padding: 10px 12px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
  .error { margin: 0 0 14px; color: var(--error); font-size: .875rem; }
</style>
</head>
<body>
<main>
  <h1>This link is protected</h1>
  <p>Enter the password to continue.</p>
  {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
  <form method="post" action="{{.Action}}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" maxlength="64" autocomplete="current-password" required autofocus>
    <button type="submit">Continue</button>
  </form>
</main>
</body>
</html>
