<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Protected link</title>
<style>
  /* Same tokens as the admin web (apps/web/src/app/app.css): neutral ink over the canvas, red only for errors. */
  :root {
    --background: #fff; --foreground: #0a0a0a; --foreground-secondary: rgb(0 0 0 / 64%);
    --border: rgb(0 0 0 / 10%); --hover: rgb(0 0 0 / 5%); --ring: var(--foreground); --destructive: #eb5757;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #0a0a0a; --foreground: #fff; --foreground-secondary: rgb(255 255 255 / 56%);
      --border: rgb(255 255 255 / 10%); --hover: rgb(255 255 255 / 9%); --destructive: #f27979;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--background); color: var(--foreground); font: 400 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  main { width: 100%; max-width: 380px; background: var(--background); border: 1px solid var(--border); border-radius: 8px; padding: 28px 24px; }
  h1 { margin: 0 0 4px; font-size: 1.25rem; font-weight: 600; line-height: 1.3; }
  p { margin: 0 0 20px; font-size: .875rem; color: var(--foreground-secondary); }
  label { display: block; margin-bottom: 6px; font-size: .875rem; font-weight: 500; }
  input { display: block; width: 100%; padding: 8px 12px; font: inherit; font-size: .875rem; color: var(--foreground); background: var(--background); border: 1px solid var(--border); border-radius: 6px; outline: 0; transition: border-color .15s ease-in-out; }
  input:focus { border-color: var(--ring); }
  button { display: flex; align-items: center; justify-content: center; width: 100%; margin-top: 14px; padding: 8px 16px; font: inherit; font-size: .875rem; font-weight: 500; line-height: 1; color: var(--background); background: var(--foreground); border: 0; border-radius: 8px; cursor: pointer; transition: opacity .3s ease-in-out; }
  button:hover { opacity: .85; }
  button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .error { margin: 0 0 14px; font-size: .75rem; color: var(--destructive); }
</style>
</head>
<body>
<main>
  <h1>This link is protected</h1>
  <p>Enter the password to continue.</p>
  {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
  <form method="post" action="{{.Action}}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" maxlength="64" autocomplete="current-password" required autofocus>
    <button type="submit">Continue</button>
  </form>
</main>
</body>
</html>
